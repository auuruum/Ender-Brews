# Project
version=1.0.0
group=dev.enderbrews
java_version=25

# Common
minecraft_version=26.3
minecraft_version_range=[26.1, 26.4)
# Minecraft releases in the jar name
minecraft_versions_label=26.1-26.3
# The same jar runs on every 26.1.x - 26.3 release (Fabric version predicate syntax)
fabric_minecraft_version_range=>=26.1 <26.4-
mod_name=Ender Brews
mod_author=auuruum
mod_id=enderbrews
license=MIT
description=Store potions in your Ender Chest and get their effects forever. Terraria-style infinite potions.
homepage=https://modrinth.com/mod/ender-brews
sources=https://github.com/auuruum/ender-brews

# Vanilla toolchain for the shared project, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric (also used on Quilt)
fabric_version=0.165.0+26.3
fabric_loader_version=0.19.5
# Oldest loader players may use: Fabric API for 26.1 needs 0.18.4 (newer Fabric API raises it itself)
fabric_loader_min_version=0.18.4

# Forge
forge_version=66.1.0
forge_loader_version_range=[62,)
# Oldest Forge / NeoForge for 26.1
forge_min_version=62
neoforge_min_version=26.1

# NeoForge
neoforge_version=26.3.0.99
neoforge_loader_version_range=[4,)

# Bukkit / Spigot / Paper
spigot_api_version=1.21.1-R0.1-SNAPSHOT
bukkit_api_version=1.21

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Forge dev runs need resources and classes in the same mod directory.
net.minecraftforge.gradle.merge-source-sets=true
