// Bukkit / Spigot / Paper / Purpur plugin. Compiled against the Spigot API only, so the
// same jar runs on Spigot and on everything built on top of it.
plugins {
    id 'enderbrews-platform'
}

// The plugin has no access to vanilla classes, so it only gets the plain Java core.
ext.sharedPackages = ['core']

repositories {
    maven {
        name = 'Spigot'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'Sonatype snapshots'
        url = 'https://oss.sonatype.org/content/repositories/snapshots'
    }
    maven {
        name = 'Minecraft libraries'
        url = 'https://libraries.minecraft.net'
    }
}

dependencies {
    compileOnly "org.spigotmc:spigot-api:${spigot_api_version}"
}

// This helper belongs only on disposable test servers and is excluded from the universal jar.
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.compileClasspath
    }
}

tasks.register('smokeCommandsJar', Jar) {
    from sourceSets.smokeTest.output
    archiveFileName = 'enderbrews-smoke-commands.jar'
}
