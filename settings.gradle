pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Ender Brews'

// Vanilla-only code shared by every platform. Never published on its own:
// each platform compiles its own relocated copy (see buildSrc/enderbrews-platform.gradle).
include('shared')

include('fabric')
include('neoforge')
include('forge')
include('bukkit')
