plugins {
    id 'enderbrews-platform'
    id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

// Runs the finished universal jar in a production Fabric client:
// ./gradlew :fabric:runProductionClient -PprodMods=<fabric-api.jar> -PquickPlay=localhost:25565
tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    minecraftVersion = providers.gradleProperty('prodMinecraft').orElse(minecraft_version)
    mods.from(rootProject.layout.buildDirectory.file("libs/EnderBrews-${version}+mc${minecraft_versions_label}.jar"))
    mods.from(providers.gradleProperty('prodMods').map { it.split(File.pathSeparator) }.orElse([]))
    runDir = file(providers.gradleProperty('prodRunDir').orElse('runs/production-client'))
    if (project.hasProperty('quickPlay')) {
        programArgs.addAll('--quickPlayMultiplayer', project.property('quickPlay').toString())
    }
}

loom {
    accessWidenerPath = file('src/main/resources/enderbrews.accesswidener')
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // ./gradlew :fabric:runClient -PquickPlay=localhost:25565 joins that server right away
            if (project.hasProperty('quickPlay')) {
                programArgs('--quickPlayMultiplayer', project.property('quickPlay').toString())
            }
            // -Pusername=Name picks the dev player name (handy for ops on a test server)
            if (project.hasProperty('username')) {
                programArgs('--username', project.property('username').toString())
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
