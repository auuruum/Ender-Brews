plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

repositories {
    mavenCentral()
}

// The sources serve every 1.21.x target; //#if lines pick the code for this target's Minecraft.
Preprocessor.selfTest()
def mcVersion = minecraft_version
def preprocessed = tasks.register('preprocessSources', Sync) {
    from(file('src/main/java'))
    into(layout.buildDirectory.dir('generated/preprocessed'))
    inputs.property('minecraft_version', mcVersion)
    eachFile { details ->
        def preprocessor = new Preprocessor(mcVersion)
        details.filter { String line -> preprocessor.line(line) }
    }
}
sourceSets.main.java.srcDirs = [preprocessed]

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_version_range': fabric_minecraft_version_range,
            'fabric_loader_version'        : fabric_loader_version,
            'fabric_loader_min_version'    : fabric_loader_min_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'homepage'                     : homepage,
            'sources'                      : sources,
            'neoforge_version'             : neoforge_version,
            'neoforge_min_version'         : neoforge_min_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'forge_version'                : forge_version,
            'forge_min_version'            : forge_min_version,
            'forge_loader_version_range'   : forge_loader_version_range,
            'bukkit_api_version'           : bukkit_api_version,
            'java_version'                 : java_version,
            'pack_format'                  : pack_format
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'plugin.yml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
