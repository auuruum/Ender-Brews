plugins {
    id 'enderbrews-platform'
    id 'net.minecraftforge.gradle'
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('runs/client')
        }
        register('client') {
            // ./gradlew :forge:runClient -PquickPlay=localhost:25565 joins that server right away
            if (project.hasProperty('quickPlay')) {
                args '--quickPlayMultiplayer', project.property('quickPlay').toString()
            }
        }
        register('server') {
            workingDir = layout.projectDirectory.dir('runs/server')
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
}

dependencies {
    // forge_minecraft_version only exists for compile checks against releases without Forge (1.21.2).
    implementation minecraft.dependency("net.minecraftforge:forge:${findProperty('forge_minecraft_version') ?: minecraft_version}-${forge_version}")
}
