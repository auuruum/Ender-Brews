plugins {
    id 'enderbrews-platform'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client {
            client()
            gameDirectory = file('runs/client')
            // ./gradlew :forge:runClient -PquickPlay=localhost:25565 joins that server right away
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickPlay').toString())
            }
        }
        server {
            server()
            gameDirectory = file('runs/server')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
